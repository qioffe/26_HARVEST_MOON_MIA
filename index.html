<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>2026 Chinese Culture Festival – Harvest Moon Celebration | Miami, FL</title>
  <meta name="description" content="Annual Chinese Culture Festival celebrating the Harvest Moon with music, martial arts, performances, and living traditions at MDC Wolfson Campus in Miami, FL.">
  <meta property="og:title" content="2026 Chinese Culture Festival – Harvest Moon Celebration | Miami, FL">
  <meta property="og:description" content="Annual Chinese Culture Festival celebrating the Harvest Moon with music, martial arts, performances, and living traditions at MDC Wolfson Campus in Miami, FL.">

  <!-- Google Fonts: Cinzel + Inter + Cormorant Garamond + Noto Serif SC + Plus Jakarta Sans + Shippori Mincho -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Shippori+Mincho:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- External Stylesheet (Relative path for Vite + GitHub Pages) -->
  <link rel="stylesheet" href="./style.css">

</head>

<body class="w-full h-full relative antialiased selection:bg-[#DFC18A] selection:text-[#121212] bg-[#040506] text-[#FAF9F6]">

  <!-- =========================================================
       HERO SCROLL TRACK & PARALLAX STAGE (Sticky Viewport)
       ========================================================= -->
  <div id="heroScrollTrack">
    <section id="heroSection" aria-label="Harvest Moon Celebration Hero">

      <!-- Atmospheric Sky Vignette & Ambient Glow -->
      <div class="top-sky-mist"></div>
      <div class="lunar-ambient-glow" id="lunarAmbientGlow"></div>

      <!-- Floating Ambient Stardust Canvas -->
      <canvas id="ambientDustCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-30"></canvas>

      <!-- HERO STAGE DARK MASK: Dims the hero backdrop (moon, mountains, foreground) on scroll (z-42) -->
      <div id="heroDarkMask" class="hero-fullscreen-darkmask" aria-hidden="true"></div>

      <!-- HERO TITLE, METADATA & CTAs (z-45) -->
      <div 
        id="heroTitleWrapper" 
        class="layer-3d absolute left-0 right-0 w-full px-4 sm:px-8 z-45 flex flex-col items-center select-none"
      >
        <!-- 1. CULTURAL MASTHEAD: Gilded Imperial Gold Lacquer & Diamond Accents -->
        <div class="mb-2 sm:mb-3 flex items-center justify-center gap-2 sm:gap-3.5">
          <span class="w-8 sm:w-14 h-[1px] bg-gradient-to-r from-transparent via-[#F5D68D]/65 to-[#F5D68D]"></span>
          <span class="text-[#F5D68D] text-xs select-none opacity-95 drop-shadow-[0_0_8px_rgba(245,214,141,0.6)]">❖</span>
          <span class="cultural-masthead-text">
            2026 迈阿密中国文化节
          </span>
          <span class="text-[#F5D68D] text-xs select-none opacity-95 drop-shadow-[0_0_8px_rgba(245,214,141,0.6)]">❖</span>
          <span class="w-8 sm:w-14 h-[1px] bg-gradient-to-l from-transparent via-[#F5D68D]/65 to-[#F5D68D]"></span>
        </div>

        <!-- 2. MAIN HERO TITLE: Chiseled Classical Display Roman & Songti -->
        <h1 class="hero-display-title w-full max-w-4xl uppercase font-bold tracking-tight mb-3 sm:mb-4">
          Harvest Moon<br>Celebration
        </h1>

        <!-- 3. DATE, TIME & VENUE STACK -->
        <div class="hero-metadata-bar flex flex-wrap items-center justify-center gap-x-3.5 gap-y-2 mb-4 sm:mb-6 max-w-2xl px-3">
          <span class="hero-meta-item whitespace-nowrap">Saturday, October 3, 2026</span>
          <span class="text-[#DFC18A] text-xs">•</span>
          <span class="hero-meta-item whitespace-nowrap">1:00 PM – 5:00 PM EDT</span>
          <span class="text-[#DFC18A] text-xs">•</span>
          <span class="hero-meta-item hero-venue-item flex items-center gap-1.5 whitespace-nowrap">
            <svg class="w-4 h-4 text-[#F7D892] inline-block shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            MDC Wolfson Campus · Miami
          </span>
        </div>

        <!-- 4. CALL TO ACTION: Gilded Gold Leaf / Deep Jade Lockup -->
        <div class="pointer-events-auto flex flex-col items-center">
          <a 
            id="heroTicketsCta"
            href="https://www.eventbrite.com/e/2026-chinese-culture-festival-harvest-moon-celebration-tickets-1998330301726" 
            target="_blank" 
            rel="noopener noreferrer"
            class="hero-cta-btn group relative inline-flex items-center justify-center rounded-full font-bold uppercase text-[#0d2c2a] bg-gradient-to-r from-[#FFF8E7] via-[#DFC18A] to-[#C2A676] hover:from-white hover:to-[#DFC18A] transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 active:scale-95"
          >
            <span class="w-1.5 h-1.5 rounded-full bg-[#0d2c2a]"></span>
            <span>Get Eventbrite Tickets</span>
            <svg class="w-3.5 h-3.5 transform group-hover:translate-x-1 transition-transform text-[#0d2c2a]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </a>
        </div>
      </div>

      <!-- BANNER LAYER (Static Sky & Far Hills, z-10) -->
      <div 
        id="bannerWrapper" 
        class="absolute inset-0 w-full h-full z-10 pointer-events-none select-none overflow-hidden block"
      >
        <picture class="banner-picture w-full h-full block">
          <source srcset="./landing/banner.webp, ./public/landing/banner.webp" type="image/webp">
          <img 
            id="bannerImg" 
            src="./landing/banner.webp" 
            onerror="if (!this.dataset.tried) { this.dataset.tried = '1'; this.src = './public/landing/banner.webp'; } else if (this.dataset.tried === '1') { this.dataset.tried = '2'; this.src = './landing/banner.png'; } else if (this.dataset.tried === '2') { this.dataset.tried = '3'; this.src = './public/landing/banner.png'; } else if (this.dataset.tried === '3') { this.dataset.tried = '4'; this.src = 'https://raw.githubusercontent.com/qioffe/26_HARVEST_MOON_MIA/main/public/landing/banner.webp'; } else if (this.dataset.tried === '4') { this.dataset.tried = '5'; this.src = 'https://cdn.jsdelivr.net/gh/qioffe/26_HARVEST_MOON_MIA@main/public/landing/banner.webp'; }"
            alt="Festival Sky and Mountain Banner" 
            width="1672"
            height="2972"
            class="w-full h-full object-cover object-bottom block select-none pointer-events-none"
            draggable="false"
            loading="eager"
            fetchpriority="high"
            decoding="async"
          >
        </picture>
      </div>

      <!-- UNIFIED THEATRICAL STAGE (Moon & Midground Mountains) -->
      <div id="theatricalStage" class="absolute inset-0 w-full h-full pointer-events-none overflow-visible z-20">
        <div class="relative w-full h-full flex justify-center items-end">

          <!-- CELESTIAL MOON -->
          <div 
            id="moonWrapper" 
            class="layer-3d absolute left-1/2 z-20 flex justify-center items-center pointer-events-none"
          >
            <picture class="moon-picture block">
              <source srcset="./landing/moon.webp, ./public/landing/moon.webp" type="image/webp">
              <img 
                id="moonElement" 
                src="./landing/moon.webp" 
                onerror="if (!this.dataset.tried) { this.dataset.tried = '1'; this.src = './public/landing/moon.webp'; } else if (this.dataset.tried === '1') { this.dataset.tried = '2'; this.src = './landing/moon.png'; } else if (this.dataset.tried === '2') { this.dataset.tried = '3'; this.src = './public/landing/moon.png'; } else if (this.dataset.tried === '3') { this.dataset.tried = '4'; this.src = 'https://raw.githubusercontent.com/qioffe/26_HARVEST_MOON_MIA/main/public/landing/moon.webp'; } else if (this.dataset.tried === '4') { this.dataset.tried = '5'; this.src = 'https://cdn.jsdelivr.net/gh/qioffe/26_HARVEST_MOON_MIA@main/public/landing/moon.webp'; }"
                alt="Harvest Moon" 
                width="636"
                height="626"
                class="object-contain select-none pointer-events-none will-change-transform"
                draggable="false" 
                loading="eager"
                fetchpriority="high"
                decoding="async"
              />
            </picture>
          </div>

          <!-- MIDGROUND MOUNTAINS (Majestic Panorama behind people) -->
          <div 
            id="midgroundWrapper" 
            class="layer-3d absolute left-1/2 bottom-0 w-full flex justify-center items-end leading-none z-[25] pointer-events-none select-none will-change-transform"
          >
            <picture class="midground-picture block">
              <source srcset="./landing/midground.webp, ./public/landing/midground.webp" type="image/webp">
              <img 
                id="midgroundImg" 
                src="./landing/midground.webp" 
                onerror="if (!this.dataset.tried) { this.dataset.tried = '1'; this.src = './public/landing/midground.webp'; } else if (this.dataset.tried === '1') { this.dataset.tried = '2'; this.src = './landing/midground.png'; } else if (this.dataset.tried === '2') { this.dataset.tried = '3'; this.src = './public/landing/midground.png'; } else if (this.dataset.tried === '3') { this.dataset.tried = '4'; this.src = 'https://raw.githubusercontent.com/qioffe/26_HARVEST_MOON_MIA/main/public/landing/midground.webp'; } else if (this.dataset.tried === '4') { this.dataset.tried = '5'; this.src = 'https://cdn.jsdelivr.net/gh/qioffe/26_HARVEST_MOON_MIA@main/public/landing/midground.webp'; }"
                alt="Midground Scenery" 
                width="1528"
                height="1038"
                class="block align-bottom select-none pointer-events-none will-change-transform"
                draggable="false" 
                loading="eager"
                fetchpriority="high"
                decoding="async"
              />
            </picture>
          </div>

        </div>
      </div>

      <!-- FOREGROUND CLOUDS & FIGURES (Edge-to-edge, Non-fading, Crisp Parallax) -->
      <div 
        id="foregroundWrapper" 
        class="layer-3d absolute inset-x-0 bottom-0 w-full flex justify-center items-end pointer-events-none z-40 origin-bottom will-change-transform"
      >
        <picture class="foreground-picture block w-full">
          <source srcset="./landing/foreground.webp, ./public/landing/foreground.webp" type="image/webp">
          <img 
            id="foregroundImg" 
            src="./landing/foreground.webp" 
            onerror="if (!this.dataset.tried) { this.dataset.tried = '1'; this.src = './public/landing/foreground.webp'; } else if (this.dataset.tried === '1') { this.dataset.tried = '2'; this.src = './landing/foreground.png'; } else if (this.dataset.tried === '2') { this.dataset.tried = '3'; this.src = './public/landing/foreground.png'; } else if (this.dataset.tried === '3') { this.dataset.tried = '4'; this.src = 'https://raw.githubusercontent.com/qioffe/26_HARVEST_MOON_MIA/main/public/landing/foreground.webp'; } else if (this.dataset.tried === '4') { this.dataset.tried = '5'; this.src = 'https://cdn.jsdelivr.net/gh/qioffe/26_HARVEST_MOON_MIA@main/public/landing/foreground.webp'; }"
            alt="Festival Foreground People & Clouds" 
            width="2752"
            height="448"
            class="w-full min-w-full h-auto block align-bottom select-none pointer-events-none will-change-transform"
            draggable="false" 
            loading="eager"
            fetchpriority="high"
            decoding="async"
          >
        </picture>
      </div>

    </section>
  </div>

  <!-- =========================================================
       STAGE PERFORMANCE PROGRAM SECTION (Neo-Chinese Playbill)
       ========================================================= -->
  <section 
    id="presentInfoStack" 
    class="relative z-30 w-full pt-4 sm:pt-6 pb-16 sm:pb-24 px-3 sm:px-6 md:px-10 flex flex-col items-center justify-center bg-[#040506] selection:bg-[#DFC18A] selection:text-[#121212]"
    aria-label="Stage Performance Program"
  >
    <!-- Smooth Top Gradient Transition Overlay -->
    <div class="pointer-events-none absolute top-0 inset-x-0 h-16 bg-gradient-to-b from-[#040506] via-[#040506]/85 to-transparent z-10"></div>

    <!-- STAGE PROGRAM CARD (Neo-Chinese Scroll Chassis) -->
    <div 
      id="stageProgramCard" 
      class="scroll-chassis relative z-20 select-auto flex flex-col pointer-events-auto max-w-4xl w-full my-auto shadow-2xl"
    >
      <!-- Corner Motifs (暗金云角纹结构) -->
      <div class="absolute top-3 sm:top-4 left-3 sm:left-4 w-4 h-4 border-t border-l fine-gold-border pointer-events-none z-20"></div>
      <div class="absolute top-3 sm:top-4 right-3 sm:right-4 w-4 h-4 border-t border-r fine-gold-border pointer-events-none z-20"></div>
      <div class="absolute bottom-3 sm:bottom-4 left-3 sm:left-4 w-4 h-4 border-b border-l fine-gold-border pointer-events-none z-20"></div>
      <div class="absolute bottom-3 sm:bottom-4 right-3 sm:right-4 w-4 h-4 border-b border-r fine-gold-border pointer-events-none z-20"></div>

      <!-- Inner Subtle Jade Frame Line (内衬黛绿暗纹) -->
      <div class="absolute inset-1.5 sm:inset-2.5 border border-[#14231f]/45 pointer-events-none z-20"></div>

      <!-- Inner Content Container -->
      <div 
        id="stageProgramScrollContainer" 
        class="grow px-3.5 sm:px-8 md:px-10 py-7 sm:py-12 relative z-10 select-text"
      >
        <!-- Subtle Ambient Lunar Aura in Header -->
        <div class="lunar-aura"></div>

        <!-- Program Dynamic Viewport Container (Loaded dynamically from MHMC-2026-STAGE.xml) -->
        <div id="stageProgramContent" class="relative z-10">
          <div class="text-center py-16 space-y-4">
            <div class="inline-block w-6 h-6 border-2 border-[#cfb268]/40 border-t-[#cfb268] rounded-full animate-spin"></div>
            <p class="font-cinzel text-xs tracking-[0.24em] text-[#87a398] uppercase">Loading Stage Performance Program...</p>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- =========================================================
       THEATRICAL CREDITS CONTAINER (Dynamic XML Auto-Update)
       ========================================================= -->
  <section 
    id="theatrical-credits-root" 
    class="bg-[#030504] text-white pt-36 sm:pt-48 pb-36 px-6 sm:px-12 select-none font-sans relative z-30 min-h-screen flex flex-col items-center justify-start selection:bg-amber-400 selection:text-black overflow-hidden"
    aria-label="Festival Organizers and Partners Credits"
  >
    <!-- Smooth Top Gradient Transition Overlay (Prevents sharp section shadow clipping) -->
    <div class="pointer-events-none absolute top-0 inset-x-0 h-40 bg-gradient-to-b from-[#030504]/0 via-[#030504]/80 to-[#030504] z-10"></div>

    <div id="tc-viewport" class="w-full max-w-6xl mx-auto text-center space-y-10 sm:space-y-12 relative z-20">
      <!-- Populated dynamically via XML -->
    </div>
  </section>

  <!-- External Script (Module & Relative path for Vite + GitHub Pages) -->
  <script type="module" src="./script.js"></script>
</body>
</html>
